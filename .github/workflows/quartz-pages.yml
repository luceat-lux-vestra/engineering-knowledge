name: Quartz Pages

on:
  pull_request:
    paths:
      - "README.md"
      - "concepts/**"
      - "patterns/**"
      - "systems/**"
      - "site/**"
      - ".github/scripts/validate-knowledge-links.cjs"
      - ".github/workflows/quartz-pages.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "concepts/**"
      - "patterns/**"
      - "systems/**"
      - "site/**"
      - ".github/scripts/validate-knowledge-links.cjs"
      - ".github/workflows/quartz-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "quartz-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engineering knowledge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout pinned Quartz 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jackyzha0/quartz
          # renovate: datasource=github-releases depName=jackyzha0/quartz versioning=semver-coerced
          ref: 568004496b900c5b365d3366b2521309952622be # v5.2.0
          path: .quartz-src

      - name: Project EK content into Quartz
        shell: bash
        run: |
          set -euo pipefail
          find .quartz-src/content -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp README.md .quartz-src/content/index.md
          cp -R concepts .quartz-src/content/concepts
          cp -R patterns .quartz-src/content/patterns
          cp -R systems .quartz-src/content/systems
          cp site/quartz.config.yaml .quartz-src/quartz.config.yaml

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: .quartz-src/package-lock.json

      - name: Validate knowledge links
        run: node .github/scripts/validate-knowledge-links.cjs README.md concepts patterns systems

      - name: Install Quartz
        working-directory: .quartz-src
        run: npm ci

      - name: Install configured Quartz plugins
        working-directory: .quartz-src
        run: npx quartz plugin install --from-config

      - name: Build Quartz
        working-directory: .quartz-src
        run: npx quartz build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .quartz-src/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
