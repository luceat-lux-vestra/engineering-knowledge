name: Quartz Pages

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "concepts/**"
      - "patterns/**"
      - "systems/**"
      - "site/**"
      - ".quartz-src"
      - ".gitmodules"
      - ".github/scripts/**"
      - ".github/workflows/quartz-pages.yml"

permissions:
  contents: read

concurrency:
  group: "quartz-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout engineering knowledge and Quartz submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm
          cache-dependency-path: .quartz-src/package-lock.json

      - name: Install Quartz
        working-directory: .quartz-src
        run: npm ci

      - name: Test knowledge validation and projection
        run: node --test .github/scripts/project-knowledge.test.mjs

      - name: Validate and project knowledge
        run: |
          node .github/scripts/project-knowledge.mjs
          cp site/quartz.config.yaml .quartz-src/quartz.config.yaml

      - name: Install configured Quartz plugins
        working-directory: .quartz-src
        run: npx quartz plugin install --from-config

      - name: Build Quartz
        working-directory: .quartz-src
        run: npx quartz build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .quartz-src/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
